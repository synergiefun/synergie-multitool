name: Build Windows EXE

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Check Python syntax
        run: python -m py_compile synergie_multitool.py

      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm SYNERGIE.spec

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: SYNERGIE-Windows-x64
          path: dist/SYNERGIE.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SYNERGIE.exe
          generate_release_notes: true
